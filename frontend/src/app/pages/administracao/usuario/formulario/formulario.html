<div class="flex flex-col gap-6 bg-surface-0 dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-700 overflow-hidden p-4 lg:p-6">
    <div class="dss-page-header border-b border-surface-200 dark:border-surface-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h2 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">{{ isEditing ? 'Editar usuário' : 'Novo usuário' }}</h2>
            <p class="text-sm text-surface-500 dark:text-white/64">O usuário novo recebe uma senha temporária e a troca no primeiro acesso.</p>
        </div>
        <div class="flex items-center gap-2">
            <ui-button label="Voltar" icon="pi pi-arrow-left" severity="secondary" text (onClick)="goBack()"></ui-button>
        </div>
    </div>

    @if (created; as user) {
    <app-temporary-password [username]="user.username" [password]="user.temporary_password" />
    }

    <div class="flex flex-col gap-6">
        <p-tabs value="principal">
            <p-tablist>
                <p-tab value="principal">Principal</p-tab>
                @if (isEditing && access()) {
                <p-tab value="permissoes">Permissões</p-tab>
                }
            </p-tablist>
            <p-tabpanels>
                <p-tabpanel value="principal">
                    <form [formGroup]="form" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-2">
                            <ui-input-text inputId="username" formControlName="username" [maxlength]="150" label="Usuário de acesso" autocomplete="off" errorMessage="Informe o usuário de acesso." />
                        </div>

                        <div class="flex flex-col gap-2">
                            <ui-input-text inputId="name" formControlName="name" [maxlength]="150" label="Nome" errorMessage="Informe o nome do usuário." />
                        </div>

                        <div class="flex items-center gap-2">
                            <ui-checkbox inputId="is_active" formControlName="is_active" label="Usuário ativo" [marginTop]="22" />
                        </div>
                    </form>
                </p-tabpanel>
                @if (access(); as userAccess) {
                <p-tabpanel value="permissoes">
                    <app-user-access [access]="userAccess" [catalog]="catalog()" [disabled]="!canEditAccess()" />
                </p-tabpanel>
                }
            </p-tabpanels>
        </p-tabs>
    </div>

    <div class="flex flex-wrap items-center justify-end gap-3">
        <ui-button label="Cancelar" severity="secondary" text (onClick)="goBack()"></ui-button>
        <ui-button label="Salvar" icon="pi pi-check" [loading]="saving" (onClick)="save()"></ui-button>
    </div>
</div>
