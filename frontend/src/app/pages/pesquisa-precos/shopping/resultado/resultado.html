<div class="flex flex-col gap-6 bg-surface-0 dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-700 overflow-hidden p-4 lg:p-6">
    <div class="dss-page-header border-b border-surface-200 dark:border-surface-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h2 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Resultado da pesquisa</h2>
            <p class="text-sm text-surface-700 dark:text-white/64">@if (search(); as current) { {{ current.created_at | date: 'dd/MM/yyyy HH:mm' }} · {{ summary }} }</p>
        </div>
        <div class="flex items-center gap-2">
            @if (canRun && hasPending && !running()) {
            <ui-button label="Continuar pesquisa" icon="fa-solid fa-play" severity="secondary" outlined (onClick)="continueSearch()"></ui-button>
            }
            <ui-button label="Voltar" icon="fa-solid fa-arrow-left" severity="secondary" text (onClick)="goBack()"></ui-button>
            @if (canRun) {
            <ui-button label="Nova pesquisa" icon="fa-solid fa-plus" (onClick)="create()"></ui-button>
            }
        </div>
    </div>

    <ui-table [value]="rows()" [columns]="columns" [totalRecords]="rows().length" [lazy]="false" [actions]="canRetry ? tableActions : []" emptyMessage="Nenhum produto nesta pesquisa."></ui-table>
</div>
