<ui-confirm-dialog></ui-confirm-dialog>

<div class="flex flex-col gap-6 bg-surface-0 dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-700 overflow-hidden p-4 lg:p-6">
    <div class="dss-page-header border-b border-surface-200 dark:border-surface-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h2 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">{{ isEditing ? 'Editar store' : 'Novo store' }}</h2>
            <p class="text-sm text-surface-700 dark:text-white/64">Configuração de store PostGIS para o contrato ativo.</p>
        </div>
        <div class="flex items-center gap-2">
            <ui-button label="Voltar" icon="pi pi-arrow-left" severity="secondary" text (onClick)="goBack()"></ui-button>
        </div>
    </div>

    <form [formGroup]="form" class="flex flex-col gap-6">
        <p-tabs value="principal">
            <p-tablist>
                <p-tab value="principal">Principal</p-tab>
                <p-tab value="publicacao">Publicação</p-tab>
            </p-tablist>
            <p-tabpanels>
                <p-tabpanel value="principal">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-2">
                            <ui-autocomplete inputId="workspace" formControlName="workspace" label="Workspace" placeholder="Digite para buscar workspace" [optionsProvider]="workspaceOptionsProvider" [errorMessage]="'Informe o workspace.'" />
                        </div>

                        <div class="flex flex-col gap-2">
                            <ui-autocomplete
                                inputId="banco_geoespacial"
                                formControlName="banco_geoespacial"
                                label="Banco geoespacial"
                                [readonly]="!workspaceGeoserverId"
                                [placeholder]="workspaceGeoserverId ? 'Digite para buscar banco' : 'Selecione um workspace primeiro'"
                                [optionsProvider]="bancoOptionsProvider"
                                [helpText]="!workspaceGeoserverId ? 'Os bancos são liberados conforme a seleção de workspace' : undefined"
                                [errorMessage]="'Informe um workspace'"
                            />
                        </div>

                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-medium text-surface-600 dark:text-white/70">Tipo</label>
                            <p-select formControlName="tipo" [options]="tipoOptions" optionLabel="label" optionValue="value" appendTo="body" [placeholder]="'Selecione o tipo'" [class]="'w-full'" />
                        </div>

                        <div class="flex flex-col gap-2">
                            <ui-input-text inputId="nome" formControlName="nome" [maxlength]="100" label="Nome" errorMessage="Informe o nome do store." />
                        </div>

                        <div class="flex items-center gap-2">
                            <ui-checkbox inputId="ativo" formControlName="ativo" label="Store ativo" [marginTop]="22" />
                        </div>
                    </div>
                </p-tabpanel>

                <p-tabpanel value="publicacao">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-2">
                            <ui-input-text inputId="schema_name" formControlName="schema_name" [maxlength]="63" label="Schema" errorMessage="Informe o schema." />
                        </div>
                    </div>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </form>

    <div class="flex flex-wrap items-center justify-end gap-3">
        <ui-button label="Cancelar" severity="secondary" text (onClick)="goBack()"></ui-button>
        <ui-button label="Salvar" icon="pi pi-check" [loading]="saving || loading" [disabled]="loading" (onClick)="save()"></ui-button>
    </div>
</div>
