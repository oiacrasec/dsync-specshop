<div class="flex flex-col gap-6 bg-surface-0 dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-700 overflow-hidden p-4 lg:p-6">
    <div class="dss-page-header border-b border-surface-200 dark:border-surface-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h2 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">{{ isEditing ? 'Editar vínculo GeoServer x Banco' : 'Novo vínculo GeoServer x Banco' }}</h2>
            <p class="text-sm text-surface-500 dark:text-white/64">Defina quais bancos podem ser utilizados por cada GeoServer.</p>
        </div>
        <div class="flex items-center gap-2">
            <ui-button label="Voltar" icon="pi pi-arrow-left" severity="secondary" text (onClick)="goBack()"></ui-button>
        </div>
    </div>

    <form [formGroup]="form" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <ui-autocomplete
            inputId="geoserver"
            formControlName="geoserver"
            label="GeoServer"
            placeholder="Digite para buscar GeoServer"
            [optionsProvider]="geoserverOptionsProvider"
            [errorMessage]="'Informe o GeoServer.'"
        />

        <ui-autocomplete
            inputId="banco"
            formControlName="banco"
            label="Banco geoespacial"
            placeholder="Digite para buscar banco"
            [optionsProvider]="bancoOptionsProvider"
            [errorMessage]="'Informe o banco geoespacial.'"
        />

        <div class="flex items-center gap-2">
            <ui-checkbox inputId="ativo" formControlName="ativo" label="Vínculo ativo" [marginTop]="22" />
        </div>
    </form>

    <div class="flex flex-wrap items-center justify-end gap-3">
        <ui-button label="Cancelar" severity="secondary" text (onClick)="goBack()"></ui-button>
        <ui-button label="Salvar" icon="pi pi-check" [loading]="saving || loading" [disabled]="loading" (onClick)="save()"></ui-button>
    </div>
</div>
