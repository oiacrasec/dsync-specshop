server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Não registrar caminhos/tokens assinados ou IPs em logs de entrega da SPA.
    access_log off;

    location /media/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

