  /api/v1/organizations/:
    get:
      operationId: organizations_list
      description: |-
        Monta `required_permission` a partir do recurso declarado na view (sem inferir do model).

        `permission_resource = 'organization'` → list/retrieve/options/schema exigem
        `organization:view`, create `:create`, update/partial_update `:update`, destroy `:delete`.
        `required_permission` declarado na própria classe sobrescreve só as ações citadas (ex.:
        actions customizadas, que nunca recebem código automático). Sem nenhum dos dois, a view
        continua negada (ADR 0009 §4). Código ausente do registry é negado na requisição.
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: public_id da organização ativa (ADR 0006).
        required: true
      - name: first
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -created_at
            - -name
            - -updated_at
            - created_at
            - name
            - updated_at
        description: |-
          Ordenado

          * `name` - Name
          * `-name` - Name (decrescente)
          * `created_at` - Created at
          * `-created_at` - Created at (decrescente)
          * `updated_at` - Updated at
          * `-updated_at` - Updated at (decrescente)
        explode: false
        style: form
      - name: rows
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
      tags:
      - organizations
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationList'
          description: ''
        '400':
          description: Requisição malformada ou header de contexto inválido.
