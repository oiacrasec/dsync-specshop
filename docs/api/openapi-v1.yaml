components:
  schemas:
    AccessGrantOutput:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        organization:
          type: string
          format: uuid
          nullable: true
        profile:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
          default: ''
          maxLength: 128
        excluded_organizations:
          type: array
          items:
            type: string
            format: uuid
        excluded_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedPermission'
        is_active:
          type: boolean
      required:
      - is_active
      - scope
    AccessGrantRequest:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        organization:
          type: string
          format: uuid
          nullable: true
        profile:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
          default: ''
          maxLength: 128
        excluded_organizations:
          type: array
          items:
            type: string
            format: uuid
        excluded_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedPermissionRequest'
      required:
      - scope
    AccessOrganization:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
      required:
      - is_active
      - name
      - public_id
    AccessProfile:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
        is_system:
          type: boolean
        is_essential:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
      - is_active
      - is_essential
      - is_system
      - name
      - permissions
      - public_id
    Contract:
      type: object
      description: Escrita administrativa global, autorizada explicitamente ao superadmin.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
          title: Identificador público
        name:
          type: string
          title: Nome
          maxLength: 255
        plan:
          type: string
          format: uuid
          title: Plano
          nullable: true
        start_date:
          type: string
          format: date
          title: Início da vigência
        end_date:
          type: string
          format: date
          nullable: true
          title: Fim da vigência
        licenses:
          type: integer
          maximum: 2147483647
          minimum: 1
          title: Licenças
        post_termination_retention_days:
          type: integer
          maximum: 365
          minimum: 0
          title: Dias de retenção após encerramento
        is_active:
          type: boolean
          title: Ativo
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - created_at
      - licenses
      - name
      - public_id
      - start_date
      - updated_at
    ContractAdmin:
      type: object
      description: 'Admin do contrato na administração: só identificação e situação
        de acesso.'
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
          title: Identificador público
        username:
          type: string
          readOnly: true
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
        name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Ativo
          description: Indica que o usuário será tratado como ativo. Ao invés de excluir
            contas de usuário, desmarque isso.
        must_change_password:
          type: boolean
          readOnly: true
          title: Deve trocar a senha
      required:
      - is_active
      - must_change_password
      - name
      - public_id
      - username
    ContractAdminPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContractAdmin'
        total_records:
          type: integer
      required:
      - data
      - total_records
    ContractAdminPasswordReset:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ContractAdmin'
        temporary_password:
          type: string
      required:
      - temporary_password
      - user
    ContractProvisionRequest:
      type: object
      description: Entrada do provisionamento; dados mínimos do admin (username e
        nome).
      properties:
        organization_name:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 1
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - name
      - organization_name
      - username
    ContractProvisionResult:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
        user:
          $ref: '#/components/schemas/UserSummary'
        temporary_password:
          type: string
