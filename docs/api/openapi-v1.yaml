components:
  schemas:
    AccessGrantOutput:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        organization:
          type: string
          format: uuid
          nullable: true
        profile:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
          default: ''
          maxLength: 128
        excluded_organizations:
          type: array
          items:
            type: string
            format: uuid
        excluded_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedPermission'
        is_active:
          type: boolean
      required:
      - is_active
      - scope
    AccessGrantRequest:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        organization:
          type: string
          format: uuid
          nullable: true
        profile:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
          default: ''
          maxLength: 128
        excluded_organizations:
          type: array
          items:
            type: string
            format: uuid
        excluded_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedPermissionRequest'
      required:
      - scope
    AccessOrganization:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
      required:
      - is_active
      - name
      - public_id
    AccessProfile:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
        is_system:
          type: boolean
        is_essential:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
      - is_active
      - is_essential
      - is_system
      - name
      - permissions
      - public_id
    Contract:
      type: object
      description: Escrita administrativa global, autorizada explicitamente ao superadmin.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
          title: Identificador público
        name:
          type: string
          title: Nome
          maxLength: 255
        plan:
          type: string
          format: uuid
          title: Plano
          nullable: true
        start_date:
          type: string
          format: date
          title: Início da vigência
        end_date:
          type: string
          format: date
          nullable: true
          title: Fim da vigência
        licenses:
          type: integer
          maximum: 2147483647
          minimum: 1
          title: Licenças
        post_termination_retention_days:
          type: integer
          maximum: 365
          minimum: 0
          title: Dias de retenção após encerramento
        is_active:
          type: boolean
          title: Ativo
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - created_at
      - licenses
      - name
      - public_id
      - start_date
      - updated_at
    ContractAdmin:
      type: object
      description: 'Admin do contrato na administração: só identificação e situação
        de acesso.'
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
          title: Identificador público
        username:
          type: string
          readOnly: true
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
        name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Ativo
          description: Indica que o usuário será tratado como ativo. Ao invés de excluir
            contas de usuário, desmarque isso.
        must_change_password:
          type: boolean
          readOnly: true
          title: Deve trocar a senha
      required:
      - is_active
      - must_change_password
      - name
      - public_id
      - username
    ContractAdminPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContractAdmin'
        total_records:
          type: integer
      required:
      - data
      - total_records
    ContractAdminPasswordReset:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ContractAdmin'
        temporary_password:
          type: string
      required:
      - temporary_password
      - user
    ContractProvisionRequest:
      type: object
      description: Entrada do provisionamento; dados mínimos do admin (username e
        nome).
      properties:
        organization_name:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 1
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - name
      - organization_name
      - username
    ContractProvisionResult:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
        user:
          $ref: '#/components/schemas/UserSummary'
        temporary_password:
          type: string
      required:
      - organization
      - temporary_password
      - user
    ContractRequest:
      type: object
      description: Escrita administrativa global, autorizada explicitamente ao superadmin.
      properties:
        name:
          type: string
          minLength: 1
          title: Nome
          maxLength: 255
        plan:
          type: string
          format: uuid
          title: Plano
          nullable: true
        start_date:
          type: string
          format: date
          title: Início da vigência
        end_date:
          type: string
          format: date
          nullable: true
          title: Fim da vigência
        licenses:
          type: integer
          maximum: 2147483647
          minimum: 1
          title: Licenças
        post_termination_retention_days:
          type: integer
          maximum: 365
          minimum: 0
          title: Dias de retenção após encerramento
        is_active:
          type: boolean
          title: Ativo
      required:
      - licenses
      - name
      - start_date
    ContractUser:
      type: object
      description: |-
        Usuários do contrato na área do cliente (8.1, decisões 54–56).

        Cadastro com username + nome e senha temporária gerada, devolvida uma única vez;
        escritas passam por save_user/delete_user (licenças, contrato e último admin).
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
          title: Identificador público
        username:
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Ativo
          description: Indica que o usuário será tratado como ativo. Ao invés de excluir
            contas de usuário, desmarque isso.
        must_change_password:
          type: boolean
          readOnly: true
          title: Deve trocar a senha
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - created_at
      - must_change_password
      - name
      - public_id
      - updated_at
      - username
    ContractUserPasswordReset:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ContractUser'
        temporary_password:
          type: string
      required:
      - temporary_password
      - user
    ContractUserRequest:
      type: object
      description: |-
        Usuários do contrato na área do cliente (8.1, decisões 54–56).

        Cadastro com username + nome e senha temporária gerada, devolvida uma única vez;
        escritas passam por save_user/delete_user (licenças, contrato e último admin).
      properties:
        username:
          type: string
          minLength: 1
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          minLength: 1
          maxLength: 150
        is_active:
          type: boolean
          title: Ativo
          description: Indica que o usuário será tratado como ativo. Ao invés de excluir
            contas de usuário, desmarque isso.
      required:
      - name
      - username
    EndedSessions:
      type: object
      properties:
        ended:
          type: integer
      required:
      - ended
    ExcludedPermission:
      type: object
      properties:
        organization:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
          maxLength: 128
      required:
      - permission
    ExcludedPermissionRequest:
      type: object
      properties:
        organization:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - permission
    LoginHistory:
      type: object
      properties:
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        ip:
          type: string
          readOnly: true
      required:
      - ip
      - occurred_at
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - refresh
      - user
    LoginResult:
      oneOf:
      - $ref: '#/components/schemas/LoginResponse'
      - $ref: '#/components/schemas/MfaChallenge'
    MenuModeEnum:
      enum:
      - static
      - overlay
      - slim
      - compact
      - reveal
      - drawer
      - horizontal
      type: string
      description: |-
        * `static` - static
        * `overlay` - overlay
        * `slim` - slim
        * `compact` - compact
        * `reveal` - reveal
        * `drawer` - drawer
        * `horizontal` - horizontal
    MfaChallenge:
      type: object
      properties:
        mfa_required:
          type: boolean
          readOnly: true
        mfa_token:
          type: string
          readOnly: true
        expires_in:
          type: integer
          readOnly: true
      required:
      - expires_in
      - mfa_required
      - mfa_token
    MfaCodeRequest:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 64
      required:
      - code
    MfaDisableRequest:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 64
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - code
      - password
    MfaLoginRequest:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 64
        mfa_token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - code
      - mfa_token
    MfaRecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - recovery_codes
    MfaSetup:
      type: object
      properties:
        secret:
          type: string
