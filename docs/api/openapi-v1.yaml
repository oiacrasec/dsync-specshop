    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    UserAccessOutput:
      type: object
      description: Formato de `selectors.user_access` (GET/PUT …/access/), só para
        o OpenAPI.
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/AccessOrganization'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/AccessProfile'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/AccessGrantOutput'
      required:
      - grants
      - organizations
      - profiles
    UserAccessRequest:
      type: object
      description: Concessões do usuário na aba Permissões (8.3); PUT substitui o
        conjunto inteiro.
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/AccessGrantRequest'
      required:
      - grants
    UserSession:
      type: object
      description: Sessão da própria conta (`/me/sessions/`); `current` marca a deste
        navegador.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        device:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        current:
          type: boolean
          readOnly: true
      required:
      - created_at
      - current
      - device
      - ip
      - last_seen_at
      - public_id
    UserSummary:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
          title: Identificador público
        username:
          type: string
          readOnly: true
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
        name:
          type: string
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Status de superusuário
          description: Indica que este usuário tem todas as permissões sem atribuí-las
            explicitamente.
        must_change_password:
          type: boolean
          readOnly: true
      required:
      - is_superuser
      - must_change_password
      - name
      - public_id
      - username
    Problem:
      type: object
      description: Problem Details (RFC 9457); `type` é urn:datasync:problem:<slug>.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - type
      - title
      - status
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
