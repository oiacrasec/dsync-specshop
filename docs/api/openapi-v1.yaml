openapi: 3.0.3
info:
  title: Dsync CORE API
  version: '1'
  description: API v1. Erros em RFC 9457 (application/problem+json); contexto pelo
    header X-Organization-Id.
paths:
  /api/v1/admin/contracts/:
    get:
      operationId: admin_contracts_list
      description: CRUD global autorizado só ao superadmin, sem contexto organizacional.
      parameters:
      - name: first
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -created_at
            - -end_date
            - -licenses
            - -name
            - -start_date
            - -updated_at
            - created_at
            - end_date
            - licenses
            - name
            - start_date
            - updated_at
        description: |-
          Ordenado

          * `name` - Name
          * `-name` - Name (decrescente)
          * `created_at` - Created at
          * `-created_at` - Created at (decrescente)
          * `updated_at` - Updated at
          * `-updated_at` - Updated at (decrescente)
          * `start_date` - Start date
          * `-start_date` - Start date (decrescente)
          * `end_date` - End date
          * `-end_date` - End date (decrescente)
          * `licenses` - Licenses
          * `-licenses` - Licenses (decrescente)
        explode: false
        style: form
      - in: query
        name: plan
        schema:
          type: string
          format: uuid
      - name: rows
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
      tags:
      - admin
      security:
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContractList'
          description: ''
        '400':
          description: Requisição malformada ou header de contexto inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sem autenticação válida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sem permissão ou sem acesso à organização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: admin_contracts_create
      description: CRUD global autorizado só ao superadmin, sem contexto organizacional.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContractRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContractRequest'
        required: true
      security:
      - jwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
          description: ''
        '400':
          description: Requisição malformada ou header de contexto inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sem autenticação válida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Sem permissão ou sem acesso à organização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflito de estado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Dados inválidos (`errors` por campo).
          content:
            application/problem+json:
              schema:
